[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpm-perspective-grid"
version = "1.0.0"
description = "J.P. Morgan Chase & Co. -- live Perspective data grid and stream processor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forage Software Engineering Lite" }]
keywords = ["perspective", "trading", "streaming", "real-time", "data-grid"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
perspective = ["perspective-python>=4.0"]
server = ["perspective-python[server]>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "perspective-python>=4.0",
    "tornado>=6.3",
]

[project.scripts]
jpm-perspective-grid = "jpm_perspective_grid.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests that take a noticeable amount of time",
]

[tool.coverage.run]
branch = true
source = ["src/jpm_perspective_grid"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
